server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Bloqueia arquivos ocultos, exceto .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Bloqueia arquivos e diretórios internos
    location ~* ^/(?:vendor|bootstrap|config|database|resources|routes|tests)/ {
        deny all;
    }

    # Impede acesso a arquivos sensíveis
    location ~* \.(?:env|log|sql|sqlite|bak|ini|conf|lock)$ {
        deny all;
    }

    # Processamento PHP
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass backend:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    }
}
